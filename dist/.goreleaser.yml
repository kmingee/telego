version: 2

project_name: telego
dist: .build

before:
  hooks:
    - go mod tidy

builds:
  - id: telego
    main: ./cmd/telego
    binary: telego
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: freebsd
        goarch: arm
        goarm: "7"
    tags:
      - poll_opt
      - gc_opt
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - config.example.toml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kmingee
    name: telego
  draft: false
  prerelease: auto
  mode: keep-existing
  header: |
    ## TeleGO {{ .Tag }}

    High-performance Telegram MTProxy with TLS fronting.
  footer: |
    **Full Changelog**: https://github.com/kmingee/telego/compare/{{ .PreviousTag }}...{{ .Tag }}
